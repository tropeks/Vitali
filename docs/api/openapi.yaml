openapi: 3.0.3
info:
  title: Vitali API
  version: 0.2.0
  description: Plataforma Hospitalar SaaS — ERP + EMR + AI
paths:
  /api/v1/_test/invitations/issue-token/:
    post:
      operationId: v1__test_invitations_issue_token_create
      description: |-
        POST /api/v1/_test/invitations/issue-token/

        Body: {"user_email": "..."}
        Returns: {"token": "<jwt>"} for an existing User (must already exist; doesn't
                 create the User row, only the UserInvitation + signed JWT).

        Security: triple-gated as documented above. Returns 404 in production.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/glosa-predict/:
    post:
      operationId: v1_ai_glosa_predict_create
      description: |-
        POST /api/v1/ai/glosa-predict/
        Returns glosa risk prediction for a TUSS code + insurer + CID-10 combination.
        Requires FEATURE_AI_GLOSA=True (global) and ai_glosa_prediction_enabled (per-tenant).
        Fail-open: always returns a response, degraded=True when AI unavailable.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/glosa-predict-batch/:
    post:
      operationId: v1_ai_glosa_predict_batch_create
      description: |-
        POST /api/v1/ai/glosa-predict-batch/

        Wraps the per-row GlosaPredictView for multi-item TISS guides. The frontend
        previously fired N parallel requests when an insurer change re-scored every
        line — under rate-limit pressure that path saturates the per-tenant ceiling.
        This endpoint accepts the shared insurer + guide_type once and an `items`
        list so a 10-procedure guide is one round-trip.

        Fail-open: when the global kill-switch or per-tenant gate is off, returns
        `risk_level=low` + `degraded=True` for every item — same contract as the
        per-row endpoint.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/tuss-suggest/:
    post:
      operationId: v1_ai_tuss_suggest_create
      description: |-
        POST /api/v1/ai/tuss-suggest/
        Returns up to 3 TUSS code suggestions for a procedure description.
        Requires FEATURE_AI_TUSS=True (global) and ai_tuss_enabled (per-tenant) and ai.use permission.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/tuss-suggest/feedback/:
    post:
      operationId: v1_ai_tuss_suggest_feedback_create
      description: |-
        POST /api/v1/ai/tuss-suggest/feedback/
        Records whether the faturista accepted or rejected a suggestion.
        Ownership check: suggestion must belong to this tenant (Decision 19).
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/tuss-sync-status/:
    get:
      operationId: v1_ai_tuss_sync_status_retrieve
      description: |-
        GET /api/v1/ai/tuss-sync-status/
        Admin-only. Returns the last 5 TUSS sync log entries and table row count.
        Used by billing overview to show the TUSS DB sync badge.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/ai/usage/:
    get:
      operationId: v1_ai_usage_retrieve
      description: |-
        GET /api/v1/ai/usage/
        Monthly usage summary. Admin only.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/allergies/:
    get:
      operationId: v1_allergies_list
      description: Standalone allergy surface (governed allergen class + coded reaction).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAllergyRecordList'
          description: ''
    post:
      operationId: v1_allergies_create
      description: Standalone allergy surface (governed allergen class + coded reaction).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyRecord'
          description: ''
  /api/v1/allergies/{id}/:
    get:
      operationId: v1_allergies_retrieve
      description: Standalone allergy surface (governed allergen class + coded reaction).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this allergy.
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyRecord'
          description: ''
    put:
      operationId: v1_allergies_update
      description: Standalone allergy surface (governed allergen class + coded reaction).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this allergy.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllergyRecordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyRecord'
          description: ''
    patch:
      operationId: v1_allergies_partial_update
      description: Standalone allergy surface (governed allergen class + coded reaction).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this allergy.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAllergyRecordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAllergyRecordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAllergyRecordRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyRecord'
          description: ''
    delete:
      operationId: v1_allergies_destroy
      description: Standalone allergy surface (governed allergen class + coded reaction).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this allergy.
        required: true
      tags:
      - v1
      responses:
        '204':
          description: No response body
  /api/v1/analytics/appointments-by-day/:
    get:
      operationId: v1_analytics_appointments_by_day_retrieve
      description: GET /api/v1/analytics/appointments-by-day/?days=30
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/appointments-by-status/:
    get:
      operationId: v1_analytics_appointments_by_status_retrieve
      description: GET /api/v1/analytics/appointments-by-status/ — current month,
        grouped by status.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/batch-throughput/:
    get:
      operationId: v1_analytics_billing_batch_throughput_retrieve
      description: |-
        GET /api/v1/analytics/billing/batch-throughput/?months=6
        Returns monthly batch creation and closure counts.
        Uses two separate queries to correctly attribute batches:
        created_at → creation month, closed_at → closure month.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/denial-by-insurer/:
    get:
      operationId: v1_analytics_billing_denial_by_insurer_retrieve
      description: |-
        GET /api/v1/analytics/billing/denial-by-insurer/?months=6
        Returns top insurers by denied value, excluding those with <10 non-draft guides.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/glosa-accuracy/:
    get:
      operationId: v1_analytics_billing_glosa_accuracy_retrieve
      description: GET /api/v1/analytics/billing/glosa-accuracy/ — prediction accuracy
        per insurer (S-037).
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/monthly-revenue/:
    get:
      operationId: v1_analytics_billing_monthly_revenue_retrieve
      description: GET /api/v1/analytics/billing/monthly-revenue/?months=6
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/operational/:
    get:
      operationId: v1_analytics_billing_operational_retrieve
      description: |-
        Operational receivables cockpit for the current competency.

        Values are deliberately derived from TISS guides only; no accounting
        entries are fabricated.  ``outstanding`` is the amount not yet paid and
        ``at_risk`` represents denied or appealed guides requiring action.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/billing/overview/:
    get:
      operationId: v1_analytics_billing_overview_retrieve
      description: GET /api/v1/analytics/billing/overview/ — current-month KPI cards.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/overview/:
    get:
      operationId: v1_analytics_overview_retrieve
      description: |-
        GET /api/v1/analytics/overview/?period=today|week|month

        Returns clinic KPIs for the requested period.  Defaults to ``month``.
        Revenue (sum of paid TISS guide values) is included when billing data exists.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/patients-by-month/:
    get:
      operationId: v1_analytics_patients_by_month_retrieve
      description: GET /api/v1/analytics/patients-by-month/?months=6
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/top-professionals/:
    get:
      operationId: v1_analytics_top_professionals_retrieve
      description: GET /api/v1/analytics/top-professionals/?limit=5
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/analytics/waiting-time/:
    get:
      operationId: v1_analytics_waiting_time_retrieve
      description: GET /api/v1/analytics/waiting-time/ — average wait stats this month.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/appointments/:
    get:
      operationId: v1_appointments_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: v1_appointments_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/:
    get:
      operationId: v1_appointments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: v1_appointments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: v1_appointments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    delete:
      operationId: v1_appointments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      responses:
        '204':
          description: No response body
  /api/v1/appointments/{id}/check-in/:
    post:
      operationId: v1_appointments_check_in_create
      description: POST /appointments/{id}/check-in/ — registra chegada do paciente
        (idempotente).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/start/:
    post:
      operationId: v1_appointments_start_create
      description: POST /appointments/{id}/start/ — inicia atendimento e abre a consulta
        vinculada.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/{id}/status/:
    patch:
      operationId: v1_appointments_status_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this appointment.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/appointments/today/:
    get:
      operationId: v1_appointments_today_retrieve
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/auth/invite/:
    post:
      operationId: v1_auth_invite_create
      description: POST /api/v1/auth/invite/ — admin creates a UserInvitation + emails
        the link.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        POST /api/v1/auth/login
        Rate limit via Redis, account lockout, Argon2id password check.
        Returns { access, refresh, user: UserDTO }
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /api/v1/auth/logout
        Blacklists the refresh token.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/disable/:
    post:
      operationId: v1_auth_mfa_disable_create
      description: |-
        POST /auth/mfa/disable/

        Platform admin only (is_staff=True).
        Deletes the TOTPDevice for the target user.
        Body: {user_id: "<uuid>"}
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/login/:
    post:
      operationId: v1_auth_mfa_login_create
      description: |-
        POST /auth/mfa/login/

        Second-factor login. The caller must already have a valid JWT (partial auth —
        credential-based) but WITHOUT the mfa_verified claim.

        Body:
          {code: "123456"}      — TOTP code
          {backup_code: "XXXX-XXXX"} — backup code (consumed on use)

        On success: re-issues JWT pair with mfa_verified=True.
        On failure: 400 {error: "Código inválido"}.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/setup/:
    post:
      operationId: v1_auth_mfa_setup_create
      description: |-
        POST /auth/mfa/setup/

        Generate a new TOTP secret and QR code for the authenticated user.
        Creates (or resets) an inactive TOTPDevice.
        Returns: {secret, qr_uri, qr_image_base64}
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/status/:
    get:
      operationId: v1_auth_mfa_status_retrieve
      description: |-
        GET /auth/mfa/status/

        Returns whether MFA is active for the authenticated user.
        Response: {is_active: bool}
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/mfa/verify/:
    post:
      operationId: v1_auth_mfa_verify_create
      description: |-
        POST /auth/mfa/verify/

        Confirm a TOTP code to activate the device.
        Rate-limited to 3 attempts per 5 minutes.
        On success: activates device, returns {backup_codes: [...]}.
        On failure: 400 {error: "Código inválido"}.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/password:
    put:
      operationId: v1_auth_password_update
      description: PUT /api/v1/auth/password
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /api/v1/auth/refresh — wraps SimpleJWT with rotation.

        SimpleJWT's refresh never loads the user, and ``token_blacklist`` tables are
        per-schema, so without this guard a refresh token minted for clinic A could be
        replayed at clinic B's domain to mint a fresh access token. We bind refresh to
        the schema the token was issued for and re-check membership (gated by
        ``ENFORCE_TENANT_MEMBERSHIP``).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/set-password/{token}/:
    post:
      operationId: v1_auth_set_password_create
      description: POST /api/v1/auth/set-password/<token>/ — public; validates token,
        sets password.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/billing/accounting/categories/:
    get:
      operationId: v1_billing_accounting_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountingCategoryList'
          description: ''
    post:
      operationId: v1_billing_accounting_categories_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountingCategoryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
