  /api/v1/hr/roster-slots/:
    get:
      operationId: v1_hr_roster_slots_list
      description: 'Lista plantões (RosterSlot), incluindo plantões que cruzam a meia-noite
        (ex.: 19h→07h). Mesmo gating de `roster.manage`; supervisores são escopados
        por unidade.'
      summary: Plantões do setor
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRosterSlotList'
          description: ''
    post:
      operationId: v1_hr_roster_slots_create
      description: |-
        Object-level unit scope for non-admin ``roster.manage`` users (S-IA2 Task B).

        Admins and central ``hr.manage`` users see every roster in the tenant. A
        sector supervisor holding only ``roster.manage`` is narrowed to the
        OrganizationalUnit(s) of their active EmployeeAssignment:

        - ``RosterSlot`` (``roster_scope`` = "slot") filters by ``unit`` directly,
          also surfacing unit-less slots on rosters at the supervisor's facility;
        - ``DutyRoster`` (``roster_scope`` = "roster") has no unit column, so it is
          scoped by the facilities of those units.

        A supervisor with no active assignment sees nothing (fail-closed) — the
        correct restrictive default until a richer coordinator↔unit link exists.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterSlotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RosterSlotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RosterSlotRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterSlot'
          description: ''
