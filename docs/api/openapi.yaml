  /api/v1/hr/employees/:
    get:
      operationId: v1_hr_employees_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeList'
          description: ''
    post:
      operationId: v1_hr_employees_create
      description: |-
        POST /api/v1/hr/employees/

        Deserializes payload then delegates to EmployeeOnboardingService which
        atomically creates Employee + User + (optional) Professional and writes
        AuditLog entries sharing a correlation_id (locked decision 2A).

        WhatsApp setup is queued post-commit if opted in (locked decision 1B).
        Invite mode (auth_mode='invite') raises 501 until T6 lands.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
  /api/v1/hr/employees/{id}/:
    get:
      operationId: v1_hr_employees_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Funcionário.
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
    put:
      operationId: v1_hr_employees_update
      description: |-
        PUT and PATCH share this path (DRF partial_update delegates here).

        Wrapped in ``transaction.atomic`` so a termination via
        ``employment_status="terminated"`` commits the status flip, the
        post_save signal, and the whole F-15 revocation cascade as ONE unit:
        if any cascade step fails, the flip rolls back too — no "terminated"
        employee left in the DB with live sessions and an active agenda (and no
        silent-no-op retry, since the status never persisted).
