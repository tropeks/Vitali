    DoseRule:
      type: object
      description: |-
        Read-only serializer for DoseRule curation list.

        INVIOLABLE: `validated` is exposed as read-only here. The only mutation path
        is through the DoseRuleViewSet.validate action — never through serializer writes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        drug_name:
          type: string
          readOnly: true
        basis:
          allOf:
          - $ref: '#/components/schemas/BasisEnum'
          readOnly: true
          description: |-
            per_kg = dose scales with body weight; fixed = weight-independent.

            * `per_kg` - Por kg de peso
            * `fixed` - Dose fixa
        dose_unit:
          allOf:
          - $ref: '#/components/schemas/DoseUnitEnum'
          readOnly: true
          description: |-
            ABSOLUTE MASS unit for every numeric field here (shared DOSE_UNIT_CHOICES): mg/mcg/mEq/unit/g. NEVER 'mg/kg' — per-kg fields are implicitly this unit per kg.

            * `mg` - mg
            * `mcg` - mcg
            * `mEq` - mEq
            * `unit` - unit
            * `g` - g
        min_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-kg lower bound (in dose_unit per kg). Required when basis='per_kg'.
        max_per_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-kg UPPER bound (in dose_unit per kg). Required when basis='per_kg'.
            This is the per-kg overdose ceiling — without it a per-kg overdose that
            stays under absolute_max_dose would pass silently.
        min_per_dose:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Absolute minimum single dose (dose_unit). Required when basis='fixed'.
        max_per_dose:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Absolute maximum single dose (dose_unit). Required when basis='fixed'.
        absolute_max_dose:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          description: MANDATORY universal hard ceiling for a single administration,
            in dose_unit. ALWAYS enforced regardless of basis. For basis='per_kg'
            it catches weight-entry typos that would otherwise push the per-kg math
            past a safe absolute dose; for basis='fixed' it is the absolute cap.
        active:
          type: boolean
          readOnly: true
        validated:
          type: boolean
          readOnly: true
        validated_by:
          type: string
          readOnly: true
        validated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - absolute_max_dose
      - active
      - basis
      - dose_unit
      - drug_name
      - id
      - max_per_dose
      - max_per_kg
      - min_per_dose
      - min_per_kg
      - validated
      - validated_at
      - validated_by
    DoseUnitEnum:
      enum:
      - mg
      - mcg
      - mEq
      - unit
      - g
      type: string
      description: |-
        * `mg` - mg
        * `mcg` - mcg
        * `mEq` - mEq
        * `unit` - unit
        * `g` - g
