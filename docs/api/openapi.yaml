components:
  schemas:
    AbnormalFlagEnum:
      enum:
      - normal
      - low
      - high
      - critical
      - undetermined
      type: string
      description: |-
        * `normal` - Normal
        * `low` - Baixo
        * `high` - Alto
        * `critical` - Crítico
        * `undetermined` - Indeterminado
    AccountingCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        code:
          type: string
          maxLength: 40
        kind:
          $ref: '#/components/schemas/Kind77cEnum'
        active:
          type: boolean
      required:
      - code
      - id
      - kind
      - name
    AccountingCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        code:
          type: string
          minLength: 1
          maxLength: 40
        kind:
          $ref: '#/components/schemas/Kind77cEnum'
        active:
          type: boolean
      required:
      - code
      - kind
      - name
    AccountingEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/Kind77cEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        competency:
          type: string
          format: date
        unit:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        reconciled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        category:
          type: integer
        cost_center:
          type: string
          format: uuid
          nullable: true
        receivable:
          type: integer
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - amount
      - category
      - category_name
      - competency
      - created_at
      - created_by
      - id
      - kind
    AccountingEntryRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/Kind77cEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        competency:
          type: string
          format: date
        unit:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        reconciled:
          type: boolean
        category:
          type: integer
        cost_center:
          type: string
          format: uuid
          nullable: true
        receivable:
          type: integer
          nullable: true
      required:
      - amount
      - category
      - competency
      - kind
    AccountsReceivable:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        guide:
          type: integer
          nullable: true
        guide_number:
          type: string
          readOnly: true
        patient_name:
          type: string
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        due_date:
          type: string
          format: date
          nullable: true
        received_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/AccountsReceivableStatusEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - guide_number
      - id
      - patient_name
      - provider_name
      - received_at
      - updated_at
    AccountsReceivableRequest:
      type: object
      properties:
        guide:
          type: integer
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        due_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/AccountsReceivableStatusEnum'
        notes:
          type: string
      required:
      - amount
    AccountsReceivableStatusEnum:
      enum:
      - expected
      - billed
      - partial
      - received
      - overdue
      - contested
      type: string
      description: |-
        * `expected` - Previsto
        * `billed` - Faturado
        * `partial` - Parcialmente recebido
        * `received` - Recebido
        * `overdue` - Vencido
        * `contested` - Contestado
    ActionEnum:
      enum:
      - continue
      - stop
      - modify
      - start
      type: string
      description: |-
        * `continue` - Manter
        * `stop` - Suspender
        * `modify` - Modificar
        * `start` - Iniciar
    AllergenClass:
      type: object
      description: |-
        Read-only serializer for AllergenClass curation list.

        INVIOLABLE: `active` is exposed as read-only here. The only mutation path is
        through the AllergenClassViewSet.set_active action — never through serializer writes.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        members:
          readOnly: true
        description:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        source:
          type: string
          readOnly: true
        version:
          type: string
          readOnly: true
      required:
      - active
      - description
      - id
      - members
      - name
      - source
      - version
    Allergy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        substance:
          type: string
          maxLength: 200
        allergen_class:
          type: string
          format: uuid
          nullable: true
          title: Classe de alérgeno
        allergen_unmatched:
          type: boolean
          readOnly: true
          description: True quando substance não foi mapeada para nenhuma AllergenClass.
        reaction:
          type: string
          maxLength: 500
        reaction_type:
          oneOf:
          - $ref: '#/components/schemas/ReactionTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        reaction_type_display:
          type: string
          readOnly: true
        severity:
          $ref: '#/components/schemas/Severity289Enum'
        severity_display:
          type: string
          readOnly: true
