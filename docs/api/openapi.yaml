  /api/v1/patients/:
    get:
      operationId: v1_patients_list
      description: |-
        Log read access (``retrieve``) of a record to the immutable AuditLog as a
        ``view_record`` action — CFM Res. 1.821/2007 requires traceability of access
        to clinical records, not just changes.

        Only single-record reads (``retrieve``) are logged, never ``list``, to keep
        the trail meaningful and avoid one row per result. Set ``audit_resource_type``
        on the viewset to the name recorded in the trail (e.g. "Patient", "Encounter").
      parameters:
      - in: query
        name: birth_date_from
        schema:
          type: string
          format: date
      - in: query
        name: birth_date_to
        schema:
          type: string
          format: date
      - in: query
        name: blood_type
        schema:
          type: string
          enum:
          - A+
          - A-
          - AB+
          - AB-
          - B+
          - B-
          - O+
          - O-
        description: |-
          * `A+` - A+
          * `A-` - A-
          * `B+` - B+
          * `B-` - B-
          * `AB+` - AB+
          * `AB-` - AB-
          * `O+` - O+
          * `O-` - O-
      - in: query
        name: gender
        schema:
          type: string
          enum:
          - F
          - M
          - N
          - O
        description: |-
          * `M` - Masculino
          * `F` - Feminino
          * `O` - Outro
          * `N` - Não informado
      - in: query
        name: has_whatsapp
        schema:
          type: boolean
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: mrn
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Busca por nome, nome social, prontuário, CPF completo, CNS completo,
          documento de identidade completo, telefone, WhatsApp ou e-mail. Identificadores
          sensíveis aceitam somente correspondência exata.
        schema:
          type: string
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientListList'
          description: ''
    post:
      operationId: v1_patients_create
      description: |-
        Log read access (``retrieve``) of a record to the immutable AuditLog as a
        ``view_record`` action — CFM Res. 1.821/2007 requires traceability of access
