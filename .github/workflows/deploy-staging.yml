name: Build — Staging Images

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-frontend
  VIEWER_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-viewer

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Um metadata POR IMAGEM — ordem 005.
      #
      # Antes havia um so, configurado com BACKEND_IMAGE, e a saida dele era
      # usada apenas no `labels:` do build do backend. Frontend e viewer nao
      # recebiam `labels:` nenhum: medido em 12/09, a imagem do frontend que a
      # lab roda tem `Config.Labels: null`, enquanto a do backend traz
      # `org.opencontainers.image.revision = d4521fae…`. Uma imagem sem revision
      # nao diz de qual commit saiu — foi exatamente o buraco que a ordem 001
      # encontrou no frontend construido a mao no PVE, e que o CI estava
      # reproduzindo em silencio.
      #
      # Nao da para reusar um metadata so: `image.title` e `image.description`
      # saem do nome da imagem, entao as tres precisam do seu.
      # `latest` so se move a partir de onda0-perimetro-multitenant — ordem 005 (c).
      #
      # Ate 12/09 os `tags:` dos tres builds eram escritos a mao e incluiam
      # `:latest` SEM condicao de branch. Um build despachado de qualquer branch
      # movia a tag: foi o que aconteceu na ordem 002, quando um build da onda0
      # levou `vitali-frontend:latest` e `vitali-backend:latest` para um commit
      # fora do master — e eu relatei o contrario, lendo o
      # `enable={{is_default_branch}}` daqui, que so alimenta `labels:`.
      #
      # Agora os `tags:` saem DESTE passo, e a condicao e explicita. Nao se usa
      # `{{is_default_branch}}` porque o default do repo e `master`, enquanto o
      # trabalho de fato acontece na onda0: a tag seguiria congelada num branch
      # que ninguem move. Quando o Capitao tornar a onda0 o default, isto vira
      # `enable={{is_default_branch}}` e a linha some.
      #
      # `format=long` preserva o nome das tags existentes (`sha-` + 40 chars).
      # Sem ele o metadata-action encurta para 7 e quebra quem referencia a tag
      # longa — a lab nao, que esta por digest, mas o habito sim.
      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/onda0-perimetro-multitenant' }}

      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/onda0-perimetro-multitenant' }}

      - name: Extract metadata (viewer)
        id: meta_viewer
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.VIEWER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/onda0-perimetro-multitenant' }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push Vitali Imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/ohif
          push: true
          tags: ${{ steps.meta_viewer.outputs.tags }}
          labels: ${{ steps.meta_viewer.outputs.labels }}
          cache-from: type=registry,ref=${{ env.VIEWER_IMAGE }}:latest
          cache-to: type=inline
