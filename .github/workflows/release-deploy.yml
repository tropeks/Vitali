name: Release — Publish Images (semver tag)

# Triggered by pushing a semantic-version tag (e.g. `v1.4.0`):
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# Builds backend, frontend, and viewer images and publishes them to GHCR with
# both the semver tag and commit SHA. Deployment is intentionally local to the
# PVE host because it has no inbound management ports.

on:
  push:
    tags:
      - "v*.*.*"

# Serialize image publication globally so two tags cannot race on shared tags.
concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-frontend
  VIEWER_IMAGE: ghcr.io/${{ github.repository_owner }}/vitali-viewer

jobs:
  # ─── Build & push the release images ────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # Guard against forks/mirrors: a v*.*.* tag pushed to any fork with Actions
    # enabled would otherwise run this pipeline there. Downstream deploy jobs
    # inherit the guard through `needs`.
    if: github.repository == 'tropeks/Vitali'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Um metadata POR IMAGEM — ordem 005. Estas sao as imagens de PRODUCAO:
      # sem `org.opencontainers.image.revision` ninguem consegue dizer de qual
      # commit saiu o que esta no ar. Ate 12/09 so o backend recebia `labels:`,
      # exatamente como no deploy-staging.yml.
      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Extract metadata (viewer)
        id: meta_viewer
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.VIEWER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push Vitali Imagem viewer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/ohif
          push: true
          tags: |
            ${{ env.VIEWER_IMAGE }}:${{ github.ref_name }}
            ${{ env.VIEWER_IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta_viewer.outputs.labels }}
          cache-from: type=registry,ref=${{ env.VIEWER_IMAGE }}:latest
          cache-to: type=inline
