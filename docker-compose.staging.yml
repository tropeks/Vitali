# Vitali — Staging Compose
# ─────────────────────────────────────────────────────────────────────────────
# Differences from docker-compose.yml (dev):
#   - DJANGO_SETTINGS_MODULE: production (DEBUG=False, HTTPS, pooling, JSON logs)
#   - restart: always (survived reboots + container crashes)
#   - DB and Redis do NOT expose host ports (internal only)
#   - Nginx with real domain config (HTTP only — terminate TLS at load balancer or
#     configure certbot separately)
#   - Images pulled from GHCR (built by deploy-staging.yml CI), not built locally
#   - Per-service resource limits (mem_limit/cpus) so one runaway container cannot
#     starve the host; healthchecks on every service for visibility.
#
# Usage:
#   cp .env.staging.example .env.staging
#   # fill in all required vars (see docs/DEPLOY.md)
#   GHCR_REPO=tropeks docker compose -p vitali-staging --env-file .env.staging -f docker-compose.staging.yml up -d

services:
  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    # PVE/LXC nested AppArmor can deny PostgreSQL's Unix socket creation.
    security_opt:
      - apparmor=unconfined
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitali}
      POSTGRES_USER: ${POSTGRES_USER:-vitali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitali}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    # No host port exposure — reachable only within the compose network

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    # No host port exposure

  # ─── Django (Gunicorn) ────────────────────────────────────────────────────
  django:
    image: ghcr.io/${GHCR_REPO}/vitali-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      DJANGO_SETTINGS_MODULE: vitali.settings.production
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-vitali.qtec.me}
      # Hardcoded (not left to .env.staging) so core.E002 cannot be silently
      # bypassed by a stale env file. Run backfill_tenant_memberships BEFORE
      # first deploy with this set — see .env.staging.example.
      ENFORCE_TENANT_MEMBERSHIP: "true"
      # Onda 2 / item 2.9: same reasoning as ENFORCE_TENANT_MEMBERSHIP above —
      # hardcoded (not left to .env.staging) so the Orthanc webhook/poller can't
      # silently go inert from a missing env var (settings/base.py defaults
      # ORTHANC_URL to ""). ORTHANC_USERNAME/PASSWORD are real credentials and
      # stay in .env.staging (see .env.staging.example) — required there via
      # ${ORTHANC_USERNAME:?...} for the orthanc/nginx services already.
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/readiness/', headers={'Host': os.environ.get('HEALTHCHECK_HOST', 'localhost'), 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    cpus: 1.5

  # ─── Celery Worker ────────────────────────────────────────────────────────
  celery-worker:
    image: ghcr.io/${GHCR_REPO}/vitali-backend:${IMAGE_TAG:-latest}
    restart: always
    command: celery -A vitali worker --loglevel=info --concurrency=2
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      DJANGO_SETTINGS_MODULE: vitali.settings.production
      # See django service: hardcoded so it can't be silently disabled.
      ENFORCE_TENANT_MEMBERSHIP: "true"
      # Onda 2 / item 2.9: this is the process that actually executes
      # imaging.sync_orthanc_studies (celery-beat only schedules it) — see
      # django service comment above.
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # MEDIDO em 25/08, dentro dos containers de staging: esta sonda sobe o
      # Django inteiro a cada execucao, e o custo disso depende do orcamento de
      # CPU do container. `celery-beat` (cpus=0.25) levou **24,9s**; o
      # `celery-worker` (cpus=1.0), **11,7s**. Com o `timeout: 15s` anterior o
      # beat estourava SEMPRE (`exit=-1`, "Health check exceeded timeout") e
      # ficava `unhealthy` permanente com o agendador despachando tarefa
      # normalmente — o log provava isso a cada minuto. O worker passava por
      # 3,3s de margem, ou seja, a um pico de carga de comecar a piscar.
      #
      # A sonda nunca esteve errada: ela foi escrita e validada contra o
      # `docker-compose.yml` base, que **nao declara limite de CPU**. Os limites
      # entraram depois, so em staging e prod, e o timeout nao foi revisitado.
      #
      # `-t 5` corta 5s da espera por resposta; `timeout: 45s` da folga real
      # sobre os 24,9s medidos; `interval: 60s` reduz pela metade a frequencia
      # com que um container de 0,25 CPU gasta o proprio orcamento provando que
      # esta vivo, em vez de despachar tarefa.
      test: ["CMD-SHELL", "celery -A vitali inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 90s
    mem_limit: 1g
    cpus: 1.0

  # ─── Celery Beat ──────────────────────────────────────────────────────────
  celery-beat:
    image: ghcr.io/${GHCR_REPO}/vitali-backend:${IMAGE_TAG:-latest}
    restart: always
    command: celery -A vitali beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    environment:
      DJANGO_SETTINGS_MODULE: vitali.settings.production
      # See django service: hardcoded so it can't be silently disabled.
      ENFORCE_TENANT_MEMBERSHIP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Beat has no native ping; broker-reachability proxy (a live worker answers).
      # MEDIDO em 25/08, dentro dos containers de staging: esta sonda sobe o
      # Django inteiro a cada execucao, e o custo disso depende do orcamento de
      # CPU do container. `celery-beat` (cpus=0.25) levou **24,9s**; o
      # `celery-worker` (cpus=1.0), **11,7s**. Com o `timeout: 15s` anterior o
      # beat estourava SEMPRE (`exit=-1`, "Health check exceeded timeout") e
      # ficava `unhealthy` permanente com o agendador despachando tarefa
      # normalmente — o log provava isso a cada minuto. O worker passava por
      # 3,3s de margem, ou seja, a um pico de carga de comecar a piscar.
      #
      # A sonda nunca esteve errada: ela foi escrita e validada contra o
      # `docker-compose.yml` base, que **nao declara limite de CPU**. Os limites
      # entraram depois, so em staging e prod, e o timeout nao foi revisitado.
      #
      # `-t 5` corta 5s da espera por resposta; `timeout: 45s` da folga real
      # sobre os 24,9s medidos; `interval: 60s` reduz pela metade a frequencia
      # com que um container de 0,25 CPU gasta o proprio orcamento provando que
      # esta vivo, em vez de despachar tarefa.
      test: ["CMD-SHELL", "celery -A vitali inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 90s
    mem_limit: 256m
    cpus: 0.25

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  nextjs:
    image: ghcr.io/${GHCR_REPO}/vitali-frontend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      DJANGO_API_URL: http://django:8000
    depends_on:
      - django
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0

  # ─── Orthanc archive (DICOM + DICOMweb only) ──────────────────────────────
  orthanc:
    image: orthancteam/orthanc:26.6.1@sha256:83a1f988c9790a8ec018d00bad2d23d29703313e10ec59ecbeb827b5fa8e0aee
    restart: always
    environment:
      ORTHANC_USERNAME: ${ORTHANC_USERNAME}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME}": "${ORTHANC_PASSWORD}"}
      VITALI_WEBHOOK_URL: http://django:8000/api/v1/imaging/orthanc/webhook/
      VITALI_WEBHOOK_SECRET: ${ORTHANC_WEBHOOK_SECRET}
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./docker/orthanc/vitali-webhook.lua:/etc/orthanc/vitali-webhook.lua:ro
      - orthanc_data:/var/lib/orthanc/db
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    healthcheck:
      # A imagem do Orthanc NAO tem curl nem wget (verificado em 25/08 contra
      # orthancteam/orthanc:26.6.1: curl AUSENTE, wget AUSENTE, python3 presente).
      # O healthcheck anterior chamava curl e falhava com
      # `/bin/sh: 1: curl: not found` em TODA execucao — o container ficava
      # permanentemente `unhealthy` com o servico perfeitamente no ar. Monitor que
      # vive vermelho e pior que monitor nenhum: ensina todo mundo a ignorar vermelho.
      # `python3` existe na imagem, e esta e a MESMA idiom que o healthcheck do
      # servico `django` deste arquivo ja usava. Usar `os.environ` em vez de
      # interpolacao de shell evita de quebra a armadilha do `$$` do compose.
      test: ["CMD-SHELL", "python3 -c \"import base64,os,urllib.request as u; c=os.environ['ORTHANC_USERNAME']+':'+os.environ['ORTHANC_PASSWORD']; h={'Authorization':'Basic '+base64.b64encode(c.encode()).decode()}; u.urlopen(u.Request('http://127.0.0.1:8042/system',headers=h),timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    depends_on:
      django:
        condition: service_started
    mem_limit: 1g
    cpus: 1.0

  # ─── Vitali Imagem (OHIF 3.12.8 standalone) ───────────────────────────────
  vitali-viewer:
    image: ghcr.io/${GHCR_REPO}/vitali-viewer:${IMAGE_TAG:-latest}
    restart: always
    # PVE's nested AppArmor profile blocks nginx-unprivileged socketpair().
    security_opt:
      - apparmor=unconfined
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/visualizador/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25

  # ─── Evolution API (WhatsApp) ─────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    restart: always
    environment:
      SERVER_PORT: 8080
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "true"
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_EVOLUTION_API_KEY}
      WEBHOOK_GLOBAL_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  # ─── DB Backup ────────────────────────────────────────────────────────────
  # Optional service — activate with: --profile backup
  # Runs scripts/backup.sh daily at 02:00 UTC via busybox crond.
  # Backups land in the `backups` named volume (see docs/BACKUPS.md).
  # Tune retention: BACKUP_KEEP_LAST=7 (default) in .env.staging.
  db-backup:
    image: postgres:16-alpine
    restart: always
    profiles:
      - backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vitali}
      POSTGRES_USER: ${POSTGRES_USER:-vitali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      KEEP_LAST: ${BACKUP_KEEP_LAST:-7}
      # REQUIRED by scripts/backup.sh's encryption guard (and by
      # vitali/settings/production.py's redundant boot-time check on the same
      # variable) — dumps hold LGPD-regulated clinical data (EMR) and must not
      # be written to disk in plaintext. Set BACKUP_ENCRYPTION_KEY in
      # .env.staging (scripts/gen_secrets.sh). BACKUP_ALLOW_PLAINTEXT is the
      # documented, explicit opt-out (docs/BACKUPS.md) for a throwaway
      # environment with no real patient data — leave unset otherwise.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-}
      # ── Offsite (ordem 004) ─────────────────────────────────────────────
      # Todas vazias por padrao: com BACKUP_S3_BUCKET vazio o backup.sh pula o
      # bloco de upload inteiro e o backup segue sendo local, que e o estado
      # atual. Preencher as cinco em .env.staging liga o offsite sem tocar aqui.
      # BACKUP_S3_COMPAT=r2 liga o contorno de checksum CRC32 do Cloudflare R2;
      # vazio, 'b2' ou 'aws' = comportamento padrao. Ver scripts/backup.sh e
      # docs/BACKUPS.md — os tres lugares dizem a mesma coisa de proposito.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_COMPAT: ${BACKUP_S3_COMPAT:-}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    # Runs backup.sh at 02:00 UTC daily via busybox crond (built into alpine).
    # crond resets the process environment, so we snapshot the container env into
    # /etc/backup.env at startup; the cron job sources it before calling backup.sh.
    # gnupg e aws-cli sao instalados aqui (nao vem na postgres:16-alpine): o
    # gpg para a cifra obrigatoria, o aws para o upload offsite — backup.sh
    # falha explicito se BACKUP_S3_BUCKET estiver setado sem o CLI. Espelha o
    # docker-compose.prod.yml, que ja instala os dois.
    #
    # ARMADILHA MEDIDA (ordem 004): o `crond` do busybox zera o ambiente, entao
    # o job le /etc/backup.env, montado pelo `printenv | grep` abaixo. Uma
    # variavel que nao casa esse filtro NAO EXISTE para o backup noturno — ainda
    # que esteja no .env e no `environment:` acima. Ate 12/09 as BACKUP_S3_*
    # ficavam de fora: quem ligasse o offsite veria o upload funcionar num
    # `docker compose exec` (ambiente completo) e o cron pular o bloco inteiro
    # em silencio toda noite, com metrica de sucesso escrita e exit 0. Ao
    # acrescentar variavel nova ao servico, acrescente-a TAMBEM aqui.
    command: >
      sh -c '
        apk add --no-cache gnupg aws-cli >/dev/null 2>&1;
        cp /usr/local/bin/backup.sh /tmp/backup.sh && chmod +x /tmp/backup.sh &&
        printenv | grep -E "^(POSTGRES_HOST|POSTGRES_PORT|POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|BACKUP_DIR|KEEP_LAST|BACKUP_ENCRYPTION_KEY|BACKUP_ALLOW_PLAINTEXT|BACKUP_S3_BUCKET|BACKUP_S3_ENDPOINT|BACKUP_S3_PREFIX|BACKUP_S3_ACCESS_KEY|BACKUP_S3_SECRET_KEY|BACKUP_S3_COMPAT)=" \
          > /etc/backup.env &&
        chmod 600 /etc/backup.env &&
        mkdir -p /var/spool/cron/crontabs &&
        printf "0 2 * * *\t. /etc/backup.env && /tmp/backup.sh >> /proc/1/fd/1 2>&1\n" \
          > /var/spool/cron/crontabs/root &&
        crond -f -d 8
      '
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.1

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    # PVE/LXC nested AppArmor also blocks nginx worker socketpair().
    security_opt:
      - apparmor=unconfined
    ports:
      - "${STAGING_HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static_files:/app/staticfiles:ro
    environment:
      NGINX_ENVSUBST_FILTER: ^ORTHANC_AUTH_HEADER$
      ORTHANC_AUTH_HEADER: ${ORTHANC_AUTH_HEADER:?Set ORTHANC_AUTH_HEADER to a Basic authorization header}
    depends_on:
      - django
      - nextjs
      - orthanc
      - vitali-viewer
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  backups:
  orthanc_data:
